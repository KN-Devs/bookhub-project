<div class="register-container">
  <h1>Créer un compte BookHub</h1>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <form (ngSubmit)="onRegister()">
    <div class="form-row">
      <div class="form-group">
        <label for="lastName">Nom</label>
        <input 
          id="lastName" 
          type="text" 
          name="lastName" 
          [(ngModel)]="lastName"
          required
          placeholder="Entrez votre nom">
        <div *ngIf="submitted && !lastName" class="error">
          Le nom est requis
        </div>
      </div>

      <div class="form-group">
        <label for="firstName">Prénom</label>
        <input 
          id="firstName" 
          type="text" 
          name="firstName" 
          [(ngModel)]="firstName"
          required
          placeholder="Entrez votre prénom">
        <div *ngIf="submitted && !firstName" class="error">
          Le prénom est requis
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input 
        id="email" 
        type="email" 
        name="email" 
        [(ngModel)]="email"
        required
        placeholder="Entrez votre email">
      <div *ngIf="submitted && !email" class="error">
        L'email est requis
      </div>
    </div>

    <div class="form-group">
      <label for="phone">Téléphone (optionnel)</label>
      <input 
        id="phone" 
        type="tel" 
        name="phone" 
        [(ngModel)]="phone"
        placeholder="Entrez votre numéro de téléphone">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          id="password" 
          type="password" 
          name="password" 
          [(ngModel)]="password"
          required
          placeholder="Au moins 6 caractères">
        <div *ngIf="submitted && !password" class="error">
          Le mot de passe est requis
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input 
          id="confirmPassword" 
          type="password" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword"
          required
          placeholder="Confirmez votre mot de passe">
        <div *ngIf="submitted && !confirmPassword" class="error">
          La confirmation est requise
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button 
        type="submit"
        [disabled]="loading"
        class="btn-primary">
        {{ loading ? 'Création en cours...' : 'S\'enregistrer' }}
      </button>

      <button 
        type="button" 
        (click)="onLogin()"
        [disabled]="loading"
        class="btn-secondary">
        Déjà inscrit? Se connecter
      </button>
    </div>
  </form>
</div>
