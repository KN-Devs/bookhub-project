<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-header">
      <div class="logo">📚</div>
      <h1>Créer un compte</h1>
      <p>Rejoignez la bibliothèque</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="row-2">
        <div class="field" [class.error]="firstName.invalid && firstName.touched">
          <label>Prénom</label>
          <input type="text" formControlName="firstName" placeholder="Jean">
          <span class="error-msg" *ngIf="firstName.touched && firstName.hasError('required')">
            Obligatoire
          </span>
        </div>

        <div class="field" [class.error]="lastName.invalid && lastName.touched">
          <label>Nom</label>
          <input type="text" formControlName="lastName" placeholder="Dupont">
          <span class="error-msg" *ngIf="lastName.touched && lastName.hasError('required')">
            Obligatoire
          </span>
        </div>
      </div>

      <div class="field" [class.error]="email.invalid && email.touched">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="vous@exemple.com">
        <span class="error-msg" *ngIf="email.touched && email.hasError('required')">L'email est obligatoire</span>
        <span class="error-msg" *ngIf="email.touched && email.hasError('email')">Email invalide</span>
      </div>

      <div class="field" [class.error]="password.invalid && password.touched">
        <label>Mot de passe</label>
        <div class="input-with-icon">
          <input [type]="showPassword ? 'text' : 'password'"
                 formControlName="password" placeholder="Min. 8 caractères">
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="error-msg" *ngIf="password.touched && password.hasError('minlength')">
          8 caractères minimum
        </span>
      </div>

      <div class="field">
        <label>Téléphone <span class="optional">(optionnel)</span></label>
        <input type="tel" formControlName="phone" placeholder="06 00 00 00 00">
      </div>

      <div class="alert alert-error" *ngIf="errorMessage">
        ⚠️ {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Créer mon compte</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

    </form>

    <p class="auth-link">
      Déjà inscrit ? <a routerLink="/">Se connecter</a>
    </p>

  </div>
</div>
