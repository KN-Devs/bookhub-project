<div class="create-container" *ngIf="book; else loading">

  <h2>Mise à jour du livre {{ book.title }}</h2>

  <form [formGroup]="bookForm" (ngSubmit)="submit()">

    <label>Titre</label>
    <input type="text" formControlName="title">

    <label>Auteur</label>
    <input type="text" formControlName="author">

    <label>ISBN</label>
    <input type="text" formControlName="isbn">

    <label>Description</label>
    <textarea formControlName="description"></textarea>

    <label>URL couverture</label>
    <input type="text" formControlName="coverImage">

    <label>Copies totales</label>
    <input type="number" formControlName="totalCopies">

    <label>Copies disponibles</label>
    <input type="number" formControlName="availableCopies">

    <label>ID catégorie</label>
    <input type="number" formControlName="categoryId">

    <button type="submit">Modifier le livre</button>

  </form>

</div>

<ng-template #loading>
  <p>Chargement du livre...</p>
</ng-template>
