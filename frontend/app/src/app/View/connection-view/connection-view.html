
<div class="connection-container">
  <h1>Bienvenue sur BookHub</h1>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <form (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        id="email" 
        type="email" 
        name="email" 
        [(ngModel)]="email"
        required
        placeholder="Entrez votre email">
      <div *ngIf="submitted && !email" class="error">
        L'email est requis
      </div>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input 
        id="password" 
        type="password" 
        name="password" 
        [(ngModel)]="password"
        required
        placeholder="Entrez votre mot de passe">
      <div *ngIf="submitted && !password" class="error">
        Le mot de passe est requis
      </div>
    </div>

    <div class="form-actions">
      <button 
        type="submit"
        [disabled]="loading"
        class="btn-primary">
        {{ loading ? 'Connexion en cours...' : 'Se connecter' }}
      </button>

      <button 
        type="button" 
        (click)="onRegister()"
        [disabled]="loading"
        class="btn-secondary">
        S'enregistrer
      </button>
    </div>
  </form>
</div>
