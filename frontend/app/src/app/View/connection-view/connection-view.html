
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-header">
      <div class="logo">📚</div>
      <h1>Connexion</h1>
      <p>Accédez à votre bibliothèque</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="field" [class.error]="email.invalid && email.touched">
        <label for="email">Adresse email</label>
        <input id="email" type="email" formControlName="email"
               placeholder="vous@exemple.com" autocomplete="email">
        <span class="error-msg" *ngIf="email.touched && email.hasError('required')">
          L'email est obligatoire
        </span>
        <span class="error-msg" *ngIf="email.touched && email.hasError('email')">
          Email invalide
        </span>
      </div>

      <div class="field" [class.error]="password.invalid && password.touched">
        <label for="password">Mot de passe</label>
        <div class="input-with-icon">
          <input id="password" [type]="showPassword ? 'text' : 'password'"
                 formControlName="password" placeholder="••••••••"
                 autocomplete="current-password">
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="error-msg" *ngIf="password.touched && password.hasError('required')">
          Le mot de passe est obligatoire
        </span>
      </div>

      <div class="alert alert-error" *ngIf="errorMessage">
        ⚠️ {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Se connecter</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

    </form>

    <p class="auth-link">
      Pas encore de compte ?
      <a routerLink="/register">Créer un compte</a>
    </p>

  </div>
</div>
